name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          DEB="${RUNNER_TEMP}/hugo.deb"
          URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          for attempt in 1 2 3 4 5; do
            echo "Download attempt ${attempt}/5..."
            if wget -q --timeout=60 --tries=2 -O "${DEB}" "${URL}" && sudo dpkg -i "${DEB}"; then
              if hugo version; then exit 0; fi
            fi
            rm -f "${DEB}"
            sleep 20
          done
          # Hugo release assets can be unavailable (observed 504s from GitHub's
          # release CDN). Fall back to building from the Go module proxy, which
          # is independent infrastructure. The theme uses plain CSS only, so the
          # non-extended binary produces identical output.
          echo "::warning::Hugo release download failed after 5 attempts; falling back to 'go install' via the Go module proxy"
          go install github.com/gohugoio/hugo@v${HUGO_VERSION}
          sudo ln -sf "$(go env GOPATH)/bin/hugo" /usr/local/bin/hugo
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
